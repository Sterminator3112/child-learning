name: Smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # three jobs run side by side, so the whole run takes as long as the slowest one
  smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Open every app and game (desktop)
            run: node tests/smoke.mjs desktop
          - name: Open every app and game (phone)
            run: node tests/smoke.mjs phone
          - name: Players, Race Off physics and accessibility
            run: node tests/features.mjs && node tests/raceoff.mjs && node tests/a11y.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every script parses
        run: for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f" || exit 1; done
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
